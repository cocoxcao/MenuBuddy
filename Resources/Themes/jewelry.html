<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Velvet Stand</title>
<link rel="stylesheet" href="base.css">
<style>
#stage { font-family: 'DM Sans', system-ui, sans-serif; color: #1A1A1A; }
.display { position: relative; display: flex; flex-direction: column; align-items: center; animation: reveal .8s cubic-bezier(.2, .9, .3, 1) both; }
@keyframes reveal { 0% { transform: translateY(-18px); opacity: 0; } 100% { transform: none; opacity: 1; } }
.arch { position: absolute; top: 0; background: #151515; }
.bust-area { position: relative; height: 160px; width: 100px; flex: none; }
.neck { position: absolute; left: 30px; top: 34px; width: 40px; height: 62px; box-sizing: border-box; background: #262626; border: 1px solid #3A3A3A; border-radius: 16px 16px 0 0; }
.shoulders { position: absolute; left: 0; top: 82px; width: 100px; height: 78px; box-sizing: border-box; background: #262626; border: 1px solid #3A3A3A; border-radius: 50px 50px 8px 8px; }
.swing { position: absolute; left: 20px; top: 56px; width: 60px; height: 110px; transform-origin: 50% 0; animation: swing 3.2s ease-in-out infinite; }
@keyframes swing { 0%, 100% { rotate: -5deg; } 50% { rotate: 5deg; } }
.swing svg { position: absolute; left: 0; top: 0; }
.pendant {
  position: absolute; left: 13px; top: 46px; width: 34px; height: 34px; box-sizing: border-box; padding: 4px;
  border: 1.5px solid #C9A45C; border-radius: 50%; background: #121212;
}
.tier { position: relative; flex: none; }
.base { position: absolute; bottom: 0; }
.base .top { height: 40px; background: #1E1E1E; clip-path: polygon(5% 0, 95% 0, 100% 100%, 0 100%); }
.base .front { height: 14px; background: #0E0E0E; }
.peds { position: absolute; left: 0; right: 0; bottom: 34px; display: flex; justify-content: center; align-items: flex-end; gap: 2px; }
.ped { display: flex; flex-direction: column; align-items: center; width: 48px; animation: rise .6s cubic-bezier(.3, 1.3, .5, 1) both; }
@keyframes rise { 0% { translate: 0 24px; opacity: 0; } 100% { translate: 0 0; opacity: 1; } }
.gem {
  width: 40px; height: 40px; box-sizing: border-box; padding: 5px;
  border: 1.5px solid #C9A45C; border-radius: 50%; background: #121212;
}
.gem.hot, .pendant.hot { box-shadow: 0 0 0 1px #C9A45C, 0 6px 14px rgba(0, 0, 0, .5); }
.cap { width: 48px; height: 12px; margin-top: -3px; box-sizing: border-box; background: #1A1A1A; border: 1.5px solid #C9A45C; border-radius: 50%; }
.frame { position: relative; width: 32px; box-sizing: border-box; border-left: 2px solid #C9A45C; border-right: 2px solid #C9A45C; }
.frame::after { content: ''; position: absolute; left: 0; right: 0; top: 40%; height: 2px; background: #C9A45C; }
.foot { width: 42px; height: 3px; background: #C9A45C; border-radius: 2px; }
.plaque {
  position: relative; z-index: 2; margin-top: -26px; background: #C9A45C; color: #1A1A1A; padding: 1px 14px; border-radius: 2px;
  font-family: 'Instrument Serif', Georgia, serif; font-style: italic; font-size: 16px; white-space: nowrap;
}
</style>
</head>
<body>
<div id="stage"></div>
<script src="buddy.js"></script>
<script>
let plaque;

Buddy.theme({
  render(apps, stage, h) {
    let pendant = null;
    let rest = apps;
    if (apps.length >= 2) { pendant = apps[0]; rest = apps.slice(1); }
    const tiers = h.rows(rest, 13);
    const maxN = Math.max(...tiers.map((t) => t.length));
    const W = Math.max(560, maxN * 50 + 90);
    const display = h.el('div', { class: 'display', style: `width:${W}px` });

    const arch = h.el('div', { class: 'arch', 'aria-hidden': 'true' });
    display.append(arch);

    const swing = h.el('div', { class: 'swing', 'data-scope': '' },
      h.frag('<svg aria-hidden="true" width="60" height="70" viewBox="0 0 60 70"><path d="M10 2Q30 92 50 2" fill="none" stroke="#C9A45C" stroke-width="1.6" stroke-dasharray="3 1.5"/></svg>'));
    if (pendant) swing.append(h.app(pendant, { class: 'pendant' }));
    display.append(h.el('div', { class: 'bust-area' },
      h.el('div', { class: 'neck', 'aria-hidden': 'true' }),
      h.el('div', { class: 'shoulders', 'aria-hidden': 'true' }),
      swing));

    let i = 0;
    let archH = 160;
    tiers.forEach((row, k) => {
      const c = row.length;
      const m = k === 0 ? 26 : 16;
      const M = k === 0 ? 26 + Math.min(70, c * 8) : 16 + Math.min(28, c * 4);
      const mid = (c - 1) / 2;
      const tierH = M + 52 + 34;
      const lift = k === 0 && c >= 5 ? Math.round((M - m) * 0.6) : 0;
      if (k === 0) archH = 160 - lift + (tierH - 54) + 10;
      const peds = h.el('div', { class: 'peds' });
      row.forEach((app, j) => {
        const t = c === 1 ? 0.5 : Math.abs(j - mid) / mid;
        const ph = Math.round(m + (M - m) * t);
        const delay = (0.2 + Math.abs(j - mid) * 0.06 + k * 0.1).toFixed(2);
        peds.append(h.el('div', { class: 'ped', 'data-scope': '', style: `animation-delay:${delay}s` },
          h.app(app, { class: 'gem' }),
          h.el('div', { class: 'cap', 'aria-hidden': 'true' }),
          h.el('div', { class: 'frame', 'aria-hidden': 'true', style: `height:${ph}px` }),
          h.el('div', { class: 'foot', 'aria-hidden': 'true' })));
        i++;
      });
      const baseW = Math.max(300, c * 50 + 70);
      display.append(h.el('div', { class: 'tier', style: `width:${W}px;height:${tierH}px;margin-top:${-lift}px` },
        h.el('div', { class: 'base', 'aria-hidden': 'true', style: `left:${(W - baseW) / 2}px;width:${baseW}px` },
          h.el('div', { class: 'top' }), h.el('div', { class: 'front' })),
        peds));
    });

    const archW = maxN > 11 ? 320 : 260;
    arch.setAttribute('style', `left:${(W - archW) / 2}px;width:${archW}px;height:${archH}px;border-radius:${archW / 2}px ${archW / 2}px 0 0`);
    plaque = h.el('div', { class: 'plaque' });
    display.append(plaque);
    stage.append(display);
  },
  hot(app) {
    if (plaque) plaque.textContent = app ? app.name : 'Maison Menu';
  },
});
</script>
</body>
</html>
